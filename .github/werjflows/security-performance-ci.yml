name: Security Audit and Performance CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 1" # Weekly security audit on Mondays

env:
  NODE_VERSION: "18.x"
  FORCE_COLOR: 1

jobs:
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Solidity linter
        run: npm run lint:sol

      - name: Run JavaScript/TypeScript linter
        run: npm run lint:js

      - name: Check code formatting
        run: npm run format:check

      - name: TypeScript type check
        run: npm run typecheck

  test-and-coverage:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  gas-optimization:
    name: Gas Optimization Analysis
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate gas report
        run: npm run gas:report
        env:
          REPORT_GAS: true
          CI: true

      - name: Upload gas report
        uses: actions/upload-artifact@v3
        with:
          name: gas-report
          path: gas-report.txt

      - name: Check contract size
        run: npm run size
        env:
          CONTRACT_SIZER: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Setup Python for Slither
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither analysis
        run: npm run security:slither
        continue-on-error: true

      - name: Security audit summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ NPM audit completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Slither static analysis completed" >> $GITHUB_STEP_SUMMARY

  dos-protection-check:
    name: DoS Protection Verification
    runs-on: ubuntu-latest
    needs: test-and-coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for unbounded loops
        run: |
          echo "Checking for potential DoS vectors..."
          grep -r "for.*feedbackCounter" contracts/ || echo "No unbounded loops detected"
          grep -r "while.*true" contracts/ || echo "No infinite loops detected"

      - name: Verify gas limits
        run: npm run gas:report
        env:
          REPORT_GAS: true

  build-and-compile:
    name: Build and Compile
    runs-on: ubuntu-latest
    needs: [test-and-coverage, gas-optimization, security-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: compiled-contracts
          path: |
            artifacts/
            cache/

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ All quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security audits completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Gas optimization verified" >> $GITHUB_STEP_SUMMARY
          echo "✅ Contracts compiled successfully" >> $GITHUB_STEP_SUMMARY
